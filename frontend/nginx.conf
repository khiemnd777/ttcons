limit_req_zone $binary_remote_addr zone=health_api:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login_api:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=session_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=upload_api:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=heavy_api:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=stream_api:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=per_client:10m;
limit_conn_zone $server_name zone=sse_global:1m;

split_clients "${request_id}" $sampled_request {
    1%      1;
    *       0;
}

map "${status}:${sampled_request}" $gateway_loggable {
    ~^[234][0-9][0-9]:0$  0;
    default                1;
}

log_format gateway '$remote_addr peer=$realip_remote_addr request_id=$request_id '
                   '"$request" status=$status bytes=$body_bytes_sent '
                   'request_time=$request_time upstream_time=$upstream_response_time';

set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header ${REAL_IP_HEADER};
real_ip_recursive on;

server {
    listen 8080 default_server;
    server_name ${SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout gateway if=$gateway_loggable;
    error_log /dev/stderr warn;
    server_tokens off;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 500;
    client_max_body_size 2m;
    large_client_header_buffers 4 16k;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn per_client 40;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;
    set $backend_upstream http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    proxy_buffering on;
    # Preserve backend 429/503 envelopes and their Retry-After values. Nginx-native
    # limit/connection failures still use the local error_page handlers below.
    proxy_intercept_errors off;

    error_page 429 = @rate_limited;
    error_page 502 504 = @service_unavailable;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 204;
    }

    # Prometheus scrapes the backend over the private service network. Never
    # forward or serve this path from the public admin origin.
    location = /metrics {
        access_log off;
        return 404;
    }

    location = /api/health {
        client_max_body_size 1k;
        limit_conn per_client 5;
        limit_req zone=health_api burst=10 nodelay;
        proxy_pass $backend_upstream;
    }

    location = /api/ready {
        client_max_body_size 1k;
        limit_conn per_client 5;
        limit_req zone=health_api burst=10 nodelay;
        proxy_pass $backend_upstream;
    }

    location = /api/auth/login {
        client_max_body_size 64k;
        limit_conn per_client 5;
        limit_req zone=login_api burst=5 nodelay;
        proxy_pass $backend_upstream;
    }

    location = /api/auth/refresh {
        client_max_body_size 16k;
        limit_conn per_client 5;
        limit_req zone=session_api burst=10 nodelay;
        proxy_pass $backend_upstream;
    }

    location = /api/auth/logout {
        client_max_body_size 16k;
        limit_conn per_client 5;
        limit_req zone=session_api burst=10 nodelay;
        proxy_pass $backend_upstream;
    }

    location ~ ^/api/(?:projects/progress-board/stream|projects/[^/]+/activity/stream|me/activity-attention/stream)$ {
        client_max_body_size 1k;
        limit_conn per_client 4;
        limit_conn sse_global 300;
        limit_req zone=stream_api burst=2 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 10s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-transform" always;
        proxy_pass $backend_upstream;
    }

    location ~ ^/api/(?:work-items/[^/]+/evidence/upload|daily-reports/[^/]+/evidence/upload|payables/[^/]+/input-invoices/upload|receivables/[^/]+/output-invoices/upload)$ {
        client_max_body_size 11m;
        client_body_timeout 30s;
        limit_conn per_client 2;
        limit_req zone=upload_api burst=2 nodelay;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass $backend_upstream;
    }

    location ~ ^/api/(?:pipeline-templates/[^/]+/pdf|workflow-form-instances/[^/]+/pdf-exports|workflow-form-pdf-exports/[^/]+/file|evidence/[^/]+/file|input-invoices/[^/]+/file|output-invoices/[^/]+/file|reports/(?:cashflow|tax|profit|projects|warehouse|procurement|accounting|staff)/export)$ {
        client_max_body_size 2m;
        limit_conn per_client 4;
        limit_req zone=heavy_api burst=3 nodelay;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass $backend_upstream;
    }

    location /api/ {
        limit_conn per_client 20;
        limit_req zone=general_api burst=40 nodelay;
        proxy_pass $backend_upstream;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Quá nhiều yêu cầu, vui lòng thử lại sau."}}';
    }

    location @service_unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Dịch vụ đang quá tải hoặc tạm thời không sẵn sàng."}}';
    }
}
