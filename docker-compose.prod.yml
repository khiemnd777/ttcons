x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

x-common-runtime: &common-runtime
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  postgres:
    <<: *common-runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - consflow_postgres:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: "${POSTGRES_SHM_SIZE:-256m}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1g}"
    cpus: "${POSTGRES_CPU_LIMIT:-1.5}"
    pids_limit: 256

  redis:
    <<: *common-runtime
    image: redis:7-alpine
    secrets:
      - redis_password
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --save 60 1000 --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - consflow_redis:/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: "${REDIS_MEMORY_LIMIT:-256m}"
    cpus: "${REDIS_CPU_LIMIT:-0.5}"
    pids_limit: 128

  redis-cache:
    <<: *common-runtime
    image: redis:7-alpine
    secrets:
      - redis_cache_password
    command:
      - /bin/sh
      - -ec
      - exec redis-server --save "" --appendonly no --maxmemory "$${REDIS_CACHE_MAXMEMORY:-192mb}" --maxmemory-policy volatile-lfu --requirepass "$$(cat /run/secrets/redis_cache_password)"
    environment:
      REDIS_CACHE_MAXMEMORY: "${REDIS_CACHE_MAXMEMORY:-192mb}"
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_cache_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: "${REDIS_CACHE_MEMORY_LIMIT:-256m}"
    cpus: "${REDIS_CACHE_CPU_LIMIT:-0.5}"
    pids_limit: 128

  migrate:
    <<: *common-runtime
    restart: "no"
    build:
      context: ./backend
    command: ["/app/consflow-migrate"]
    environment:
      APP_ENV: "production"
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATIONS_DIR: /app/migrations
      MIGRATION_LOCK_TIMEOUT: "${MIGRATION_LOCK_TIMEOUT:-30s}"
      MIGRATION_TIMEOUT: "${MIGRATION_TIMEOUT:-5m}"
    secrets:
      - database_url
    networks:
      - app_internal
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: "${MIGRATE_MEMORY_LIMIT:-256m}"
    cpus: "${MIGRATE_CPU_LIMIT:-0.5}"
    pids_limit: 64
    init: true

  backend:
    <<: *common-runtime
    build:
      context: ./backend
    environment:
      APP_ENV: "production"
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_CACHE_URL_FILE: /run/secrets/redis_cache_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SETTINGS_ENCRYPTION_KEY_FILE: /run/secrets/settings_encryption_key
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      AUTH_RECOVERY_ENABLED: "${AUTH_RECOVERY_ENABLED:-false}"
      AUTH_RECOVERY_TOKEN_TTL: "${AUTH_RECOVERY_TOKEN_TTL:-15m}"
      AUTH_RECOVERY_VERIFY_TTL: "${AUTH_RECOVERY_VERIFY_TTL:-24h}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Consflow}"
      SMTP_TLS_MODE: "${SMTP_TLS_MODE:-starttls}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10s}"
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "false"
      STORAGE_PROVIDER: "s3"
      STORAGE_OPERATION_TIMEOUT: "${STORAGE_OPERATION_TIMEOUT:-30s}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET is required}"
      STORAGE_S3_REGION: "${STORAGE_S3_REGION:?STORAGE_S3_REGION is required}"
      STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-}"
      STORAGE_S3_USE_PATH_STYLE: "${STORAGE_S3_USE_PATH_STYLE:-false}"
      STORAGE_S3_ALLOW_INSECURE_ENDPOINT: "${STORAGE_S3_ALLOW_INSECURE_ENDPOINT:-false}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
      AUTH_ACCESS_TOKEN_MINUTES: "${AUTH_ACCESS_TOKEN_MINUTES:-15}"
      AUTH_REFRESH_TOKEN_HOURS: "${AUTH_REFRESH_TOKEN_HOURS:-168}"
      AUTH_REFRESH_COOKIE_SECURE: "true"
      AUTH_REFRESH_COOKIE_SAME_SITE: "${AUTH_REFRESH_COOKIE_SAME_SITE:-Lax}"
      TRUSTED_PROXY_CIDRS: "${APP_INTERNAL_SUBNET:?APP_INTERNAL_SUBNET is required}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-15s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-0s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-15s}"
      READINESS_TIMEOUT: "${READINESS_TIMEOUT:-2s}"
      DB_STATEMENT_TIMEOUT: "${DB_STATEMENT_TIMEOUT:-15s}"
      DB_LOCK_TIMEOUT: "${DB_LOCK_TIMEOUT:-5s}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-20}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
      DB_CONN_MAX_IDLE_TIME: "${DB_CONN_MAX_IDLE_TIME:-5m}"
      REDIS_OPERATION_TIMEOUT: "${REDIS_OPERATION_TIMEOUT:-250ms}"
      PROJECT_EXPLORER_CACHE_MODE: "${PROJECT_EXPLORER_CACHE_MODE:-off}"
      PROJECT_EXPLORER_CACHE_TIMEOUT: "${PROJECT_EXPLORER_CACHE_TIMEOUT:-200ms}"
      PROJECT_EXPLORER_CACHE_INDEX_TTL: "${PROJECT_EXPLORER_CACHE_INDEX_TTL:-5m}"
      PROJECT_EXPLORER_CACHE_ROW_TTL: "${PROJECT_EXPLORER_CACHE_ROW_TTL:-10m}"
      PROJECT_EXPLORER_CACHE_LOCK_TTL: "${PROJECT_EXPLORER_CACHE_LOCK_TTL:-2s}"
      PROJECT_EXPLORER_CACHE_MAX_VALUE_BYTES: "${PROJECT_EXPLORER_CACHE_MAX_VALUE_BYTES:-262144}"
      RATE_LIMIT_REDIS_MAX_IN_FLIGHT: "${RATE_LIMIT_REDIS_MAX_IN_FLIGHT:-32}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_MODE: "${RATE_LIMIT_MODE:-enforce}"
      RATE_LIMIT_LOCAL_MAX_KEYS: "${RATE_LIMIT_LOCAL_MAX_KEYS:-10000}"
      RATE_LIMIT_IP_AUTH_LIMIT: "${RATE_LIMIT_IP_AUTH_LIMIT:-10}"
      RATE_LIMIT_IP_AUTH_BURST: "${RATE_LIMIT_IP_AUTH_BURST:-10}"
      RATE_LIMIT_IP_AUTH_WINDOW: "${RATE_LIMIT_IP_AUTH_WINDOW:-1m}"
      RATE_LIMIT_IP_GENERAL_LIMIT: "${RATE_LIMIT_IP_GENERAL_LIMIT:-300}"
      RATE_LIMIT_IP_GENERAL_BURST: "${RATE_LIMIT_IP_GENERAL_BURST:-60}"
      RATE_LIMIT_IP_GENERAL_WINDOW: "${RATE_LIMIT_IP_GENERAL_WINDOW:-1m}"
      RATE_LIMIT_IP_UPLOAD_LIMIT: "${RATE_LIMIT_IP_UPLOAD_LIMIT:-20}"
      RATE_LIMIT_IP_UPLOAD_BURST: "${RATE_LIMIT_IP_UPLOAD_BURST:-5}"
      RATE_LIMIT_IP_UPLOAD_WINDOW: "${RATE_LIMIT_IP_UPLOAD_WINDOW:-1m}"
      RATE_LIMIT_IP_EXPORT_LIMIT: "${RATE_LIMIT_IP_EXPORT_LIMIT:-30}"
      RATE_LIMIT_IP_EXPORT_BURST: "${RATE_LIMIT_IP_EXPORT_BURST:-5}"
      RATE_LIMIT_IP_EXPORT_WINDOW: "${RATE_LIMIT_IP_EXPORT_WINDOW:-1m}"
      RATE_LIMIT_IP_SSE_LIMIT: "${RATE_LIMIT_IP_SSE_LIMIT:-30}"
      RATE_LIMIT_IP_SSE_BURST: "${RATE_LIMIT_IP_SSE_BURST:-5}"
      RATE_LIMIT_IP_SSE_WINDOW: "${RATE_LIMIT_IP_SSE_WINDOW:-1m}"
      RATE_LIMIT_ACTOR_AUTH_LIMIT: "${RATE_LIMIT_ACTOR_AUTH_LIMIT:-30}"
      RATE_LIMIT_ACTOR_AUTH_BURST: "${RATE_LIMIT_ACTOR_AUTH_BURST:-10}"
      RATE_LIMIT_ACTOR_AUTH_WINDOW: "${RATE_LIMIT_ACTOR_AUTH_WINDOW:-1m}"
      RATE_LIMIT_ACTOR_GENERAL_LIMIT: "${RATE_LIMIT_ACTOR_GENERAL_LIMIT:-600}"
      RATE_LIMIT_ACTOR_GENERAL_BURST: "${RATE_LIMIT_ACTOR_GENERAL_BURST:-120}"
      RATE_LIMIT_ACTOR_GENERAL_WINDOW: "${RATE_LIMIT_ACTOR_GENERAL_WINDOW:-1m}"
      RATE_LIMIT_ACTOR_UPLOAD_LIMIT: "${RATE_LIMIT_ACTOR_UPLOAD_LIMIT:-30}"
      RATE_LIMIT_ACTOR_UPLOAD_BURST: "${RATE_LIMIT_ACTOR_UPLOAD_BURST:-5}"
      RATE_LIMIT_ACTOR_UPLOAD_WINDOW: "${RATE_LIMIT_ACTOR_UPLOAD_WINDOW:-1m}"
      RATE_LIMIT_ACTOR_EXPORT_LIMIT: "${RATE_LIMIT_ACTOR_EXPORT_LIMIT:-60}"
      RATE_LIMIT_ACTOR_EXPORT_BURST: "${RATE_LIMIT_ACTOR_EXPORT_BURST:-10}"
      RATE_LIMIT_ACTOR_EXPORT_WINDOW: "${RATE_LIMIT_ACTOR_EXPORT_WINDOW:-1m}"
      RATE_LIMIT_ACTOR_SSE_LIMIT: "${RATE_LIMIT_ACTOR_SSE_LIMIT:-20}"
      RATE_LIMIT_ACTOR_SSE_BURST: "${RATE_LIMIT_ACTOR_SSE_BURST:-4}"
      RATE_LIMIT_ACTOR_SSE_WINDOW: "${RATE_LIMIT_ACTOR_SSE_WINDOW:-1m}"
      UPLOAD_CONCURRENCY: "${UPLOAD_CONCURRENCY:-4}"
      EXPORT_CONCURRENCY: "${EXPORT_CONCURRENCY:-4}"
      REPORT_CONCURRENCY: "${REPORT_CONCURRENCY:-6}"
      SSE_MAX_CONNECTIONS: "${SSE_MAX_CONNECTIONS:-300}"
      SSE_MAX_CONNECTIONS_PER_IP: "${SSE_MAX_CONNECTIONS_PER_IP:-20}"
      SSE_MAX_CONNECTIONS_PER_ACTOR: "${SSE_MAX_CONNECTIONS_PER_ACTOR:-2}"
      SSE_VISIBILITY_TIMEOUT: "${SSE_VISIBILITY_TIMEOUT:-2s}"
      SSE_MAX_CONNECTION_LIFETIME: "${SSE_MAX_CONNECTION_LIFETIME:-5m}"
      SSE_BROKER_CHANNEL: "${SSE_BROKER_CHANNEL:-consflow:activity:v1}"
    secrets:
      - database_url
      - redis_url
      - redis_cache_url
      - jwt_secret
      - settings_encryption_key
      - smtp_password
    expose:
      - "8080"
    networks:
      - app_internal
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: "${BACKEND_MEMORY_LIMIT:-1g}"
    cpus: "${BACKEND_CPU_LIMIT:-2.0}"
    pids_limit: 256
    init: true

  admin:
    <<: *common-runtime
    container_name: admin
    user: "101:101"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      TRUSTED_PROXY_CIDR: "${TRUSTED_PROXY_CIDR:?TRUSTED_PROXY_CIDR is required}"
      REAL_IP_HEADER: "${REAL_IP_HEADER:-X-Forwarded-For}"
    ports:
      - "${ADMIN_BIND_ADDRESS:?ADMIN_BIND_ADDRESS is required}:${ADMIN_PORT:-8080}:8080"
    networks:
      - edge
      - app_internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,uid=101,gid=101,mode=0700,size=1m
      - /data:rw,noexec,nosuid,uid=101,gid=101,mode=0700,size=16m
      - /tmp:rw,noexec,nosuid,uid=101,gid=101,mode=0700,size=16m
    mem_limit: "${ADMIN_MEMORY_LIMIT:-256m}"
    cpus: "${ADMIN_CPU_LIMIT:-1.0}"
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    init: true

networks:
  edge:
  app_internal:
    internal: true
    ipam:
      config:
        - subnet: "${APP_INTERNAL_SUBNET:?APP_INTERNAL_SUBNET is required}"

secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}"
  database_url:
    file: "${DATABASE_URL_FILE:?DATABASE_URL_FILE is required}"
  redis_password:
    file: "${REDIS_PASSWORD_FILE:?REDIS_PASSWORD_FILE is required}"
  redis_url:
    file: "${REDIS_URL_FILE:?REDIS_URL_FILE is required}"
  redis_cache_password:
    file: "${REDIS_CACHE_PASSWORD_FILE:?REDIS_CACHE_PASSWORD_FILE is required}"
  redis_cache_url:
    file: "${REDIS_CACHE_URL_FILE:?REDIS_CACHE_URL_FILE is required}"
  jwt_secret:
    file: "${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}"
  settings_encryption_key:
    file: "${SETTINGS_ENCRYPTION_KEY_FILE:?SETTINGS_ENCRYPTION_KEY_FILE is required}"
  smtp_password:
    file: "${SMTP_PASSWORD_FILE:-/dev/null}"

volumes:
  consflow_postgres:
  consflow_redis:
