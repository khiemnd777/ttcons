# Example only. Do not add this file to the base kustomization and do not commit
# a populated copy. Prefer the cluster's external secret controller/KMS-backed
# secret manager. Every CHANGE_ME value is rejected by production validation.
apiVersion: v1
kind: Secret
metadata:
  name: consflow-runtime-secrets
  namespace: consflow
  labels:
    app.kubernetes.io/part-of: consflow
type: Opaque
stringData:
  database_url: CHANGE_ME_POSTGRES_TLS_URL
  migration_database_url: CHANGE_ME_POSTGRES_DDL_OWNER_TLS_URL
  redis_url: CHANGE_ME_REDIS_TLS_URL
  redis_cache_url: CHANGE_ME_DEDICATED_CACHE_REDIS_TLS_URL
  jwt_secret: CHANGE_ME_AT_LEAST_32_RANDOM_BYTES
  # Omit these keys when the reviewed platform overlay uses workload identity.
  aws_access_key_id: CHANGE_ME_S3_ACCESS_KEY
  aws_secret_access_key: CHANGE_ME_S3_SECRET_KEY
  # Optional for temporary credentials.
  aws_session_token: ""
