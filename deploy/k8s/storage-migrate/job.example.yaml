# Optional pre-cutover operator Job. It is excluded from the application base
# and deliberately cannot run until an overlay supplies an immutable image,
# bucket/region and an existing RWX PVC containing the legacy UPLOAD_DIR tree.
apiVersion: batch/v1
kind: Job
metadata:
  # Add a release/run-unique nameSuffix in the operator overlay.
  name: consflow-storage-migrate-dry-run
  namespace: consflow
  labels:
    app.kubernetes.io/name: storage-migrate
    app.kubernetes.io/instance: consflow
    app.kubernetes.io/component: storage-migration
    app.kubernetes.io/part-of: consflow
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7500
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-migrate
        app.kubernetes.io/instance: consflow
        app.kubernetes.io/component: storage-migration
        app.kubernetes.io/part-of: consflow
    spec:
      serviceAccountName: consflow-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: storage-migrate
          image: registry.example.invalid/consflow/backend:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/app/consflow-storage-migrate"]
          # No --apply here: the example is dry-run by default. A second,
          # separately named reviewed overlay must add args: ["--apply"].
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL_FILE
              value: /var/run/secrets/consflow/database_url
            - name: UPLOAD_DIR
              value: /legacy/uploads
            - name: STORAGE_PROVIDER
              value: s3
            - name: STORAGE_OPERATION_TIMEOUT
              value: 30s
            - name: STORAGE_MIGRATION_TIMEOUT
              value: 2h
            - name: STORAGE_S3_BUCKET
              value: ""
            - name: STORAGE_S3_REGION
              value: ""
            - name: STORAGE_S3_ENDPOINT
              value: ""
            - name: STORAGE_S3_USE_PATH_STYLE
              value: "false"
            - name: STORAGE_S3_ALLOW_INSECURE_ENDPOINT
              value: "false"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: consflow-runtime-secrets
                  key: aws_access_key_id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: consflow-runtime-secrets
                  key: aws_secret_access_key
                  optional: true
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consflow-runtime-secrets
                  key: aws_session_token
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-secrets
              mountPath: /var/run/secrets/consflow
              readOnly: true
            - name: legacy-uploads
              mountPath: /legacy/uploads
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-secrets
          secret:
            secretName: consflow-runtime-secrets
            optional: false
            defaultMode: 0440
            items:
              - key: database_url
                path: database_url
        - name: legacy-uploads
          persistentVolumeClaim:
            claimName: replace-with-legacy-upload-rwx-pvc
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
