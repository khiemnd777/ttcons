apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: consflow
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/instance: consflow
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: consflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Required hostname anti-affinity deliberately permits only one admin pod
      # per node. Replacing one pod at a time avoids requiring a third node
      # during a rollout of the two-replica baseline.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
      app.kubernetes.io/instance: consflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/instance: consflow
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: consflow
    spec:
      serviceAccountName: consflow-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: admin
                  app.kubernetes.io/instance: consflow
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: admin
              app.kubernetes.io/instance: consflow
      containers:
        - name: admin
          image: registry.example.invalid/consflow/admin:replace-me
          imagePullPolicy: IfNotPresent
          env:
            - name: TRUSTED_PROXY_CIDR
              valueFrom:
                configMapKeyRef:
                  name: consflow-runtime
                  key: TRUSTED_PROXY_CIDR
            - name: REAL_IP_HEADER
              valueFrom:
                configMapKeyRef:
                  name: consflow-runtime
                  key: REAL_IP_HEADER
          command: ["/usr/bin/caddy"]
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-ec", "sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: caddy-config
              mountPath: /config
            - name: caddy-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddy-config
          emptyDir:
            sizeLimit: 1Mi
        - name: caddy-data
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
