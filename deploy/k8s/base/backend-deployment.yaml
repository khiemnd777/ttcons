apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: consflow
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: consflow
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: consflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Required hostname anti-affinity deliberately permits only one backend
      # pod per node. Replacing one pod at a time avoids requiring a third node
      # during a rollout of the two-replica baseline.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: consflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: consflow
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: consflow
    spec:
      serviceAccountName: consflow-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: backend
                  app.kubernetes.io/instance: consflow
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
              app.kubernetes.io/instance: consflow
      containers:
        - name: backend
          image: registry.example.invalid/consflow/backend:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: consflow-runtime
          env:
            - name: DATABASE_URL_FILE
              value: /var/run/secrets/consflow/database_url
            - name: REDIS_URL_FILE
              value: /var/run/secrets/consflow/redis_url
            - name: JWT_SECRET_FILE
              value: /var/run/secrets/consflow/jwt_secret
            # The AWS SDK v2 default credential chain also supports a reviewed
            # workload-identity overlay. These optional static keys are the
            # portable S3-compatible fallback and still come only from Secret.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: consflow-runtime-secrets
                  key: aws_access_key_id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: consflow-runtime-secrets
                  key: aws_secret_access_key
                  optional: true
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consflow-runtime-secrets
                  key: aws_session_token
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-ec", "sleep 5"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-secrets
              mountPath: /var/run/secrets/consflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-secrets
          secret:
            secretName: consflow-runtime-secrets
            optional: false
            defaultMode: 0440
            items:
              - key: database_url
                path: database_url
              - key: redis_url
                path: redis_url
              - key: jwt_secret
                path: jwt_secret
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
