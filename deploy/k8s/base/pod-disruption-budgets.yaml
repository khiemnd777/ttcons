apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: consflow
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: consflow
    app.kubernetes.io/part-of: consflow
