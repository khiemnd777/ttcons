# The application namespace is ingress-denied by workload selector. Platform
# edge and monitoring namespaces/pods must carry both documented labels; an
# arbitrary cluster pod cannot bypass admin or scrape/call backend directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-ingress
  namespace: consflow
  labels:
    app.kubernetes.io/part-of: consflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admin
      app.kubernetes.io/instance: consflow
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              consflow.network/edge: enabled
          podSelector:
            matchLabels:
              consflow.network/edge-client: enabled
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: consflow
  labels:
    app.kubernetes.io/part-of: consflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: consflow
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: admin
              app.kubernetes.io/instance: consflow
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              consflow.network/monitoring: enabled
          podSelector:
            matchLabels:
              consflow.network/metrics-client: enabled
      ports:
        - port: 8080
          protocol: TCP
