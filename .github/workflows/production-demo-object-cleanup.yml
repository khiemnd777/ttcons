name: Production demo S3 object cleanup

on:
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Guarded demo S3 object cleanup
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout operator source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test and build one-time operator
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          go test ./cmd/demo-object-cleanup
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/demo-object-cleanup" ./cmd/demo-object-cleanup

      - name: Configure pinned SSH host
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload and run guarded operator
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          port="${VPS_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$port" \
            "$VPS_USER@$VPS_HOST" 'install -d -m 0700 /opt/consflow/shared/operators && test "$(uname -m)" = x86_64'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -P "$port" \
            "$RUNNER_TEMP/demo-object-cleanup" \
            "$VPS_USER@$VPS_HOST:/opt/consflow/shared/operators/demo-object-cleanup"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$port" \
            "$VPS_USER@$VPS_HOST" 'chmod 0555 /opt/consflow/shared/operators/demo-object-cleanup'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$port" \
            "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/vps/production-demo-object-cleanup.sh

      - name: Verify public HTTPS after original app restart
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output /dev/null https://tt-dnh.com/gateway-health
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            --output /dev/null https://tt-dnh.com/api/ready
