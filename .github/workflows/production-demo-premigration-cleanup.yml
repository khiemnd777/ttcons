name: Production demo pre-migration cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_DEMO_PROJECTS_V145 for the inventoried demo database
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Backup and clear inventoried demo projects
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Validate one-time operator input
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DELETE_DEMO_PROJECTS_V145

      - name: Checkout cleanup script
        uses: actions/checkout@v4

      - name: Configure pinned SSH host
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run guarded cleanup on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          port="${VPS_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$port" \
            "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/vps/production-demo-premigration-cleanup.sh

      - name: Verify original release returned healthy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output /dev/null https://tt-dnh.com/gateway-health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output /dev/null https://tt-dnh.com/api/ready
