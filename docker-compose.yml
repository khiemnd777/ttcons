services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:?POSTGRES_BIND_ADDRESS is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - consflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_BIND_ADDRESS:?REDIS_BIND_ADDRESS is required}:${REDIS_PORT:?REDIS_PORT is required}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-lfu"]
    ports:
      - "${REDIS_CACHE_BIND_ADDRESS:?REDIS_CACHE_BIND_ADDRESS is required}:${REDIS_CACHE_PORT:?REDIS_CACHE_PORT is required}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    user: "${LOCAL_UID:?LOCAL_UID is required}:${LOCAL_GID:?LOCAL_GID is required}"
    environment:
      APP_ENV: "${APP_ENV:?APP_ENV is required}"
      PORT: "${PORT:?PORT is required}"
      DATABASE_URL: "${COMPOSE_DATABASE_URL:?COMPOSE_DATABASE_URL is required}"
      REDIS_URL: "${COMPOSE_REDIS_URL:?COMPOSE_REDIS_URL is required}"
      REDIS_CACHE_URL: "${COMPOSE_REDIS_CACHE_URL:?COMPOSE_REDIS_CACHE_URL is required}"
      PROJECT_EXPLORER_CACHE_MODE: "${PROJECT_EXPLORER_CACHE_MODE:?PROJECT_EXPLORER_CACHE_MODE is required}"
      PROJECT_EXPLORER_CACHE_TIMEOUT: "${PROJECT_EXPLORER_CACHE_TIMEOUT:-200ms}"
      PROJECT_EXPLORER_CACHE_INDEX_TTL: "${PROJECT_EXPLORER_CACHE_INDEX_TTL:-5m}"
      PROJECT_EXPLORER_CACHE_ROW_TTL: "${PROJECT_EXPLORER_CACHE_ROW_TTL:-10m}"
      PROJECT_EXPLORER_CACHE_LOCK_TTL: "${PROJECT_EXPLORER_CACHE_LOCK_TTL:-2s}"
      PROJECT_EXPLORER_CACHE_MAX_VALUE_BYTES: "${PROJECT_EXPLORER_CACHE_MAX_VALUE_BYTES:-262144}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      AUTH_RECOVERY_ENABLED: "${AUTH_RECOVERY_ENABLED:-false}"
      AUTH_RECOVERY_TOKEN_TTL: "${AUTH_RECOVERY_TOKEN_TTL:-15m}"
      AUTH_RECOVERY_VERIFY_TTL: "${AUTH_RECOVERY_VERIFY_TTL:-24h}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Consflow}"
      SMTP_TLS_MODE: "${SMTP_TLS_MODE:-starttls}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10s}"
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "${AUTO_MIGRATE:?AUTO_MIGRATE is required}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:?STORAGE_PROVIDER is required}"
      STORAGE_PATH: /storage
      STORAGE_OPERATION_TIMEOUT: "${STORAGE_OPERATION_TIMEOUT:?STORAGE_OPERATION_TIMEOUT is required}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
      STORAGE_S3_REGION: "${STORAGE_S3_REGION:-}"
      STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-}"
      STORAGE_S3_USE_PATH_STYLE: "${STORAGE_S3_USE_PATH_STYLE:-false}"
      STORAGE_S3_ALLOW_INSECURE_ENDPOINT: "${STORAGE_S3_ALLOW_INSECURE_ENDPOINT:-false}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:?MAX_UPLOAD_BYTES is required}"
    ports:
      - "${BACKEND_BIND_ADDRESS:?BACKEND_BIND_ADDRESS is required}:${BACKEND_PORT:?BACKEND_PORT is required}:${PORT:?PORT is required}"
    volumes:
      - type: bind
        source: "${STORAGE_PATH:?STORAGE_PATH is required}"
        target: /storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  admin:
    container_name: admin
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
    ports:
      - "${ADMIN_BIND_ADDRESS:?ADMIN_BIND_ADDRESS is required}:${ADMIN_PORT:?ADMIN_PORT is required}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  consflow_postgres:
