services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consflow
      POSTGRES_USER: consflow
      POSTGRES_PASSWORD: consflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - consflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consflow -d consflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://consflow:consflow@postgres:5432/consflow?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: consflow-local-dev-secret
      FRONTEND_ORIGIN: http://localhost:5173
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "true"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - consflow_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    container_name: admin
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  consflow_postgres:
  consflow_uploads:
